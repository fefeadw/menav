# 默认页面配置（请勿直接修改）。
# 建议复制到 config/user/pages/bookmarks.yml 并按需调整。
# 说明：该页面通常由“书签导入工具”自动生成，手工修改时请保持字段结构一致。
title: 书签
subtitle: bookmarks

# 指定使用的内置页面类型（由 Astro 组件渲染）
# 提示：bookmarks 页面标题区会自动显示“内容更新：YYYY-MM-DD（git|mtime）”，无需额外配置
template: bookmarks

