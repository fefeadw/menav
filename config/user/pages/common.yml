# 默认页面配置（请勿直接修改）。
# 建议复制到 config/user/pages/common.yml 并按需调整。
title: 常用网站 # 页面标题
subtitle: Common website # 页面副标题

# 指定使用的内置页面类型（由 Astro 组件渲染）
# 说明：推荐使用通用页面类型 page；首页由“导航第一项”决定
template: page

# 页面分类与站点列表
categories:
  - name: 置顶
    icon: fas fa-star # 分类图标
    sites:
      - name: 星播客 # 站点名称
        url: https://china-portal.mercedes-benz.com.cn/ # http/https URL（favicon 模式将尝试加载站点图标）
        icon: fab fa-linux # 手动图标：manual 模式使用；favicon 模式下作为回退
        description: 星播客 # 站点描述
      - name: 星平台
        url: https://otl-cn.i.mercedes-benz.com/
        icon: czs-book
        description: 星平台
        faviconUrl: assets/menav.svg
      - name: OTR正式系统
        url: https://otr.mercedes-benz.com.cn/#/
        icon: fab fa-google
        description: OTR正式系统
      - name: 企业邮箱
        url: https://www.qiye.aliyun.com
        icon: fab fa-github
        description: 企业邮箱
      - name: Stack Overflow
        url: https://stackoverflow.com
        icon: fab fa-stack-overflow
        description: 程序员问答社区

